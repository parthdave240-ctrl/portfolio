<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The LinkedIn system loop: find, draft, review, engage, log, with a human approval step and a cap of five people a day">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1ECFA"/>
      <stop offset="1" stop-color="#E8E0F5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <circle cx="1120" cy="580" r="160" fill="#4B2A8C" opacity="0.06"/>
  <circle cx="70" cy="60" r="110" fill="#4B2A8C" opacity="0.06"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="60" y="95" font-size="54" font-weight="700" fill="#4B2A8C">LinkedIn growth system</text>
    <text x="60" y="140" font-size="27" fill="#5A5650">Five people a day. You approve everything.</text>

    <!-- flow nodes -->
    <g font-size="30" font-weight="700" text-anchor="middle">
      <rect x="45" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/>
      <text x="140" y="298" fill="#1C1A17">Find</text>
      <rect x="275" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/>
      <text x="370" y="298" fill="#1C1A17">Draft</text>
      <rect x="505" y="230" width="190" height="120" rx="18" fill="#4B2A8C"/>
      <text x="600" y="298" fill="#FFFFFF">Review</text>
      <rect x="735" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/>
      <text x="830" y="298" fill="#1C1A17">Engage</text>
      <rect x="965" y="230" width="190" height="120" rx="18" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/>
      <text x="1060" y="298" fill="#1C1A17">Log</text>
    </g>
    <!-- captions -->
    <g font-size="21" fill="#5A5650" text-anchor="middle">
      <text x="140" y="392">ICP-scored posts</text>
      <text x="370" y="392">One short comment</text>
      <text x="600" y="392" fill="#4B2A8C" font-weight="700">You approve</text>
      <text x="830" y="392">Comment, then request</text>
      <text x="1060" y="392">CRM record</text>
    </g>
  </g>
  <!-- arrows -->
  <g stroke="#4B2A8C" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="241" y1="290" x2="268" y2="290"/><polyline points="258,280 269,290 258,300"/>
    <line x1="471" y1="290" x2="498" y2="290"/><polyline points="488,280 499,290 488,300"/>
    <line x1="701" y1="290" x2="728" y2="290"/><polyline points="718,280 729,290 718,300"/>
    <line x1="931" y1="290" x2="958" y2="290"/><polyline points="948,280 959,290 948,300"/>
  </g>
  <!-- guardrail chips -->
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#1C1A17">
    <rect x="60" y="470" width="270" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/><text x="195" y="506" text-anchor="middle">Daily cap of 5</text>
    <rect x="350" y="470" width="320" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/><text x="510" y="506" text-anchor="middle">Account verified first</text>
    <rect x="690" y="470" width="330" height="56" rx="28" fill="#FFFFFF" stroke="#D9CFEA" stroke-width="2"/><text x="855" y="506" text-anchor="middle">Stops on any warning</text>
  </g>
</svg>
